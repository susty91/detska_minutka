<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dětská minutka – hravý časovač pro děti</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="description" content="Barevná minutka pro děti. Vyber si pohádkový motiv, nastav 1–60 minut a sleduj, jak se obrázek postupně vybarvuje." />
  <style>
    :root{color-scheme:light;--ink:#34445f;--muted:#8491a8;--lavender:#816bd6;--soft:#faf7ff;--edge:#e9e8f3;--shadow:0 18px 50px rgba(73,72,128,.11)}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,-apple-system,sans-serif;color:var(--ink);background:radial-gradient(circle at 14% 18%,#f4eaff 0,transparent 26%),radial-gradient(circle at 87% 80%,#def5fb 0,transparent 29%),#fffaf7;min-height:100vh;min-height:100dvh;overflow-x:hidden}
    button,input{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible,input:focus-visible{outline:3px solid #ab8bff;outline-offset:3px}
    .shell{width:min(1200px,96vw);margin:auto;min-height:100vh;min-height:100dvh;display:flex;align-items:center;flex-direction:column}
    header{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 18px 10px}
    .logo{display:flex;gap:10px;align-items:center;font-size:clamp(17px,1.8vw,23px);font-weight:900;letter-spacing:-.05em;white-space:nowrap}
    .logo-mark{width:38px;height:38px;display:grid;place-items:center;background:#fff;box-shadow:0 5px 16px #ddd2ef8c;border-radius:14px;font-size:24px}
    .tagline{font-weight:700;color:#a393bf;font-size:12px;letter-spacing:.015em;margin-top:1px}
    .settings{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.94);border:1px solid #f0e8f1;padding:10px 12px 10px 18px;border-radius:24px;box-shadow:0 8px 24px #9987aa19;min-width:min(750px,72vw)}
    .setting-title{font-size:13px;font-weight:800;color:#807d99;white-space:nowrap}
    #duration{appearance:none;-webkit-appearance:none;display:block;flex:1;min-width:100px;height:12px;border-radius:100px;background:linear-gradient(90deg,#ff98ad 0%,#ffc97c 25%,#a0dc98 50%,#7fcdf0 75%,#ae9af7 100%);box-shadow:inset 0 1px 3px #57506b1a;cursor:pointer}
    #duration::-webkit-slider-thumb{-webkit-appearance:none;width:29px;height:29px;background:#fff;border:5px solid #8a70e1;box-shadow:0 2px 6px #61518d45;border-radius:50%}
    #duration::-moz-range-thumb{width:19px;height:19px;background:#fff;border:5px solid #8a70e1;box-shadow:0 2px 6px #61518d45;border-radius:50%}
    #duration{touch-action:none;overscroll-behavior:contain;}
    .selected-time{background:#f2edff;color:#6954ba;min-width:104px;padding:8px 10px;text-align:center;border-radius:15px;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
    .top-extras{display:flex;gap:7px}
    .icon-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid #eae4ef;border-radius:14px;background:#fff;color:#7b7394;font-size:19px;box-shadow:0 2px 8px #857c9b10}
    .icon-button:hover{background:#f6f2ff}
    .presets{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 12px 0;max-width:100%}
    .preset{border:1px solid #eae4f0;background:#fffafc;color:#7d7b93;border-radius:100px;font-size:12px;font-weight:800;padding:7px 13px;box-shadow:0 3px 9px #8472a70b}
    .preset.active{background:#8d79d7;border-color:#8d79d7;color:white;box-shadow:0 4px 12px #8d79d745}
    main{width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
    .clock-frame{width:min(75vmin,730px);aspect-ratio:1;position:relative;filter:drop-shadow(0px 15px 18px #9394ac29);flex:0 0 auto}
    .clock{height:100%;width:100%;overflow:visible}
    .dial-number{fill:#9098b0;font-size:22px;font-weight:800;text-anchor:middle;dominant-baseline:central;letter-spacing:-.05em}
    .dial-number.zero{fill:#ed8ea1;font-size:25px}
    .tick{stroke:#cfd5e2;stroke-width:2.2;stroke-linecap:round}
    .tick.major{stroke:#9ca6bb;stroke-width:4}
    .remaining-display{font-size:clamp(16px,3vw,20px);font-weight:800;fill:#9493aa;letter-spacing:.01em}
    .countdown{font-size:68px;fill:#4a486d;font-weight:900;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
    .countdown.long{font-size:50px}
    .dial-message{font-size:18px;font-weight:800;fill:#9a8fae}
    .timed-out{fill:#d878a8}
    .moving-unicorn{filter:drop-shadow(0 3px 5px #8e72b940)}
    .actions{display:flex;gap:10px;justify-content:center;align-items:center;padding-bottom:4px}
    .action{border:none;border-radius:17px;height:51px;padding:0 30px;font-weight:900;font-size:17px;display:flex;align-items:center;gap:9px;justify-content:center}
    .primary{background:linear-gradient(120deg,#9575e3,#7867c8);color:#fff;box-shadow:0 8px 20px #7f65c847}
    .primary:hover{filter:brightness(1.07)}
    .secondary{background:#fff;border:1px solid #eae5ed;color:#77778f;box-shadow:0 4px 12px #8579a91a}
    .secondary:hover{background:#fbf8ff}
    .footnote{font-size:13px;color:#a6a1b2;text-align:center;margin:0 0 12px;font-weight:700}
    .overlay{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;display:none}
    .overlay.show{display:block}
    @media (max-width:780px){header{display:flex;flex-wrap:wrap;justify-content:center;padding:12px 8px 8px;gap:10px}.logo{font-size:19px}.tagline{display:none}.settings{order:3;width:100%;min-width:0;padding:10px 10px 10px 12px;border-radius:19px}.setting-title{font-size:12px}.top-extras{margin-left:auto}.presets{margin-top:6px}.clock-frame{width:min(88vw,70dvh);max-width:600px}.clock .dial-number{font-size:24px}.action{height:48px;padding:0 24px}.footnote{font-size:12px}}

    @media(max-width:450px){header{padding:10px 8px}.logo{width:100%;justify-content:center;font-size:17px}.top-extras{position:absolute;right:12px;top:8px}.icon-button{width:34px;height:34px;border-radius:10px}.settings{padding:9px 10px;gap:7px}.setting-title{font-size:11px}.selected-time{font-size:16px;padding:8px 7px;min-width:79px}.presets{gap:5px}.preset{font-size:11px;padding:6px 10px}.clock-frame{width:min(96vw,55dvh)}.actions{padding:0}.footnote{padding:0 14px;line-height:1.4}}

    /* Svislé měřítko určuje počet minut na celý kruh, nikoliv délku odpočtu. */
    .clock-stage{display:flex;align-items:center;justify-content:center;width:100%;min-width:0;padding-right:clamp(88px,12vw,170px)}
    .scale-panel{position:fixed;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:92px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 8px 14px;background:rgba(255,255,255,.92);border:1px solid #f0e8f1;border-radius:24px;box-shadow:0 8px 24px #9987aa19;backdrop-filter:blur(8px);z-index:3;text-align:center}
    .scale-title{font-size:11px;font-weight:800;line-height:1.25;color:#807d99;letter-spacing:.015em}
    .scale-value{background:#f2edff;color:#6954ba;min-width:72px;padding:7px 8px;text-align:center;border-radius:15px;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
    .scale-subtitle{color:#a393bf;font-weight:700;font-size:10px;line-height:1.25;max-width:76px}
    .vertical-range-box{width:48px;height:clamp(168px,35vmin,284px);position:relative;display:flex;align-items:center;justify-content:center;touch-action:none}
    .scale-track{height:100%;width:46px;position:relative;display:block;cursor:grab;touch-action:none;outline-offset:2px;border-radius:22px;user-select:none;-webkit-user-select:none}
    .scale-track:active{cursor:grabbing}
    .scale-track::before{content:"";position:absolute;top:0;bottom:0;left:17px;width:12px;border-radius:100px;background:linear-gradient(180deg,#ae9af7 0%,#7fcdf0 25%,#a0dc98 50%,#ffc97c 75%,#ff98ad 100%);box-shadow:inset 0 1px 3px #57506b1a}
    .scale-thumb{position:absolute;left:50%;top:var(--pos,50%);width:29px;height:29px;border-radius:50%;border:5px solid #8a70e1;background:#fff;box-shadow:0 2px 6px #61518d45;transform:translate(-50%,-50%);pointer-events:none}
    .scale-track:focus-visible{outline:3px solid #ab8bff}
    .scale-edge{font-size:10px;line-height:1.15;font-weight:800;color:#a29ab2}
    #previewSound{font-size:21px}
    .unicorn-drop{position:absolute;top:-125px;width:104px;height:116px;animation:unicornFall linear forwards;opacity:.96;will-change:transform}
    .unicorn-drop svg{width:100%;height:100%;display:block;filter:drop-shadow(0 5px 8px rgba(126,104,186,.25))}
    .dino-drop{width:132px;height:132px;top:-150px}
    @keyframes unicornFall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--spin));opacity:0}}
    @media(max-width:780px){.clock-frame{width:min(74vw,67dvh)}.clock-stage{padding-right:92px}.scale-panel{width:84px;padding:10px 6px 12px;border-radius:20px;gap:8px;right:max(6px,env(safe-area-inset-right))}.scale-title{font-size:10px}.scale-value{font-size:14px;min-width:64px;padding:6px 6px}.scale-subtitle{font-size:9px;max-width:68px}.vertical-range-box{height:clamp(150px,32vmin,228px)}}
    @media(max-width:450px){header .logo{width:auto;justify-content:flex-start;font-size:16px;margin-right:117px}header .logo-mark{flex-shrink:0}.clock-frame{width:min(74vw,56dvh)}.clock-stage{padding-right:76px}.scale-panel{width:70px;padding:9px 4px 10px;border-radius:18px;gap:7px;right:4px}.scale-title{font-size:9px}.scale-value{font-size:12px;padding:5px 4px;min-width:54px;border-radius:10px}.scale-subtitle{font-size:8px;max-width:58px}.vertical-range-box{height:clamp(118px,28vmin,186px)}.scale-edge{font-size:8px}.unicorn-drop{width:80px;height:90px}}
    @media(max-height:660px) and (min-width:781px){.clock-frame{width:min(65vmin,600px)}.vertical-range-box{height:clamp(140px,29vmin,218px)}}
    .themes{display:flex;align-items:center;justify-content:center;gap:5px;background:#fff;border:1px solid #ede9f1;border-radius:20px;padding:5px;margin:8px auto 0;box-shadow:0 4px 15px #9987aa17}
    .theme-option{font-size:14px;font-weight:850;border:0;background:transparent;color:#807b98;border-radius:15px;padding:8px 17px;line-height:1.1;white-space:nowrap}
    .theme-option.active{color:white;background:linear-gradient(120deg,#9575e3,#7867c8);box-shadow:0 4px 12px #7f65c844}
    .theme-option.active[data-theme="dino"]{background:linear-gradient(120deg,#57bba1,#328c85)}
     .theme-option.active[data-theme="unicorn"]{background:linear-gradient(120deg,#f39ac9,#b989dc)}
    .theme-option.active[data-theme="rocket"]{background:linear-gradient(120deg,#7aa7ff,#7b64d8)}
    .theme-option.active[data-theme="digger"]{background:linear-gradient(120deg,#f2bf52,#d18d22)}
    .theme-option.active[data-theme="giraffe"]{background:linear-gradient(120deg,#f3b663,#d9853c)}
    .clock[hidden]{display:none}
    .dino-scene{filter:drop-shadow(0 10px 24px #77aa9a25)}
    .dino-time{font-size:67px;font-weight:900;letter-spacing:-.04em;fill:#385b56;font-variant-numeric:tabular-nums;text-anchor:middle}
    .dino-time.long{font-size:52px}
    .dino-label{font-size:22px;font-weight:900;fill:#448d81;letter-spacing:.055em;text-anchor:middle}
    .dino-progress{font-size:22px;font-weight:900;fill:#6e9e97;text-anchor:middle}
     .unicorn-scene{filter:drop-shadow(0 10px 24px #bd90bc25)}
     .unicorn-time{font-size:67px;font-weight:900;letter-spacing:-.04em;fill:#73538e;font-variant-numeric:tabular-nums;text-anchor:middle}

    .rocket-scene{filter:drop-shadow(0 10px 24px #7f86d925)}

    .giraffe-scene{filter:drop-shadow(0 10px 24px #d79e5d25)}
    .giraffe-time{font-size:67px;font-weight:900;letter-spacing:-.04em;fill:#8b5d2c;font-variant-numeric:tabular-nums;text-anchor:middle}
    .giraffe-label{font-size:21px;font-weight:900;fill:#cc8442;letter-spacing:.035em;text-anchor:middle}
    .giraffe-progress{font-size:22px;font-weight:900;fill:#b88352;text-anchor:middle}
    body.is-dino .scale-panel,body.is-unicorn .scale-panel,body.is-rocket .scale-panel,body.is-digger .scale-panel,body.is-giraffe .scale-panel{display:none}
    body.is-dino .clock-stage,body.is-unicorn .clock-stage,body.is-rocket .clock-stage,body.is-digger .clock-stage,body.is-giraffe .clock-stage{padding-right:0}
    body.is-dino .clock-frame,body.is-unicorn .clock-frame,body.is-rocket .clock-frame,body.is-digger .clock-frame,body.is-giraffe .clock-frame{width:min(75vmin,730px)}
    @media(max-width:780px){body.is-dino .clock-frame,body.is-unicorn .clock-frame,body.is-rocket .clock-frame,body.is-digger .clock-frame,body.is-giraffe .clock-frame{width:min(87vw,65dvh)}.theme-option{font-size:12px;padding:7px 13px}.dino-drop,.unicorn-body-drop,.rocket-body-drop,.digger-body-drop,.giraffe-body-drop{width:104px;height:104px}}
    @media(max-width:450px){body.is-dino .clock-frame,body.is-unicorn .clock-frame,body.is-rocket .clock-frame,body.is-digger .clock-frame,body.is-giraffe .clock-frame{width:min(94vw,56dvh)}.themes{margin-top:7px}.dino-drop,.unicorn-body-drop,.rocket-body-drop,.digger-body-drop,.giraffe-body-drop{width:92px;height:92px}.theme-option{font-size:11px;padding:7px 10px}}
    @media(prefers-reduced-motion:reduce){.unicorn-drop{animation:none}}

    /* Všechny ilustrované motivy mají stejnou velikost a zarovnání. */

    body.is-car .clock-stage,body.is-tractor .clock-stage,body.is-firetruck .clock-stage,body.is-ocean .clock-stage,body.is-princess .clock-stage,body.is-knight .clock-stage{padding-right:0}
    body.is-car .clock-frame,body.is-tractor .clock-frame,body.is-firetruck .clock-frame,body.is-ocean .clock-frame,body.is-princess .clock-frame,body.is-knight .clock-frame{width:min(75vmin,730px)}

    .theme-picker{margin:9px auto 0;display:flex;justify-content:center}

  }
  function paint(){
    const leftMin=Math.max(0,remainingMs/60000),f=Math.min(1,leftMin/dialMax);
    const arcLength=120*f;
    for(const band of bands)band.setAttribute('stroke-dasharray',`${arcLength} ${120-arcLength}`);
    sector.setAttribute('d',wedgePath(f));
    if(f<=.00001){endpoint.style.display='none';}else{
      endpoint.style.display='';
      const a=-Math.PI/2+f*2*Math.PI;
      endpoint.setAttribute('transform',`translate(${(400+246*Math.cos(a)).toFixed(2)} ${(400+246*Math.sin(a)).toFixed(2)}) scale(.9)`);
    }
    const progressed=Math.max(0,Math.min(1,1-remainingMs/(selected*60000)));
    const pct=Math.floor(progressed*100);
    Object.values(sceneThemes).forEach(scene=>{
      scene.fill.setAttribute('y',String(scene.baseY-scene.span*progressed));
      scene.fill.setAttribute('height',String(scene.span*progressed));
      scene.progress.textContent=scene.progressText(pct);
    });
    const displayed=Math.ceil(remainingMs/1000);
    if(displayed!==lastShown){
      lastShown=displayed;
      const formatted=clockFormat(remainingMs);
      time.textContent=formatted;
      Object.values(sceneThemes).forEach(scene=>scene.time.textContent=formatted);
      time.classList.toggle('long',false);
    }
    const activeScene=sceneThemes[theme];
    if(remainingMs<=0){
      label.textContent='ČAS VYPRŠEL!';label.classList.add('timed-out');message.textContent='Hurá, dokázali jsme to! 🎉';
      status.textContent=activeScene?activeScene.finishedStatus:'Konec čekání! Duha se schovala. 🌟';
    } else {
      label.textContent='ZBÝVÁ JEŠTĚ';label.classList.remove('timed-out');
      message.textContent=running?'jednorožci odpočítávají 🦄':'a duha kouzlí dál ✨';
      status.textContent=activeScene?(running?activeScene.runningStatus:activeScene.idleStatus):(running?'Pozoruj, jak duha pomalu mizí. 🌈':'Jak duha mizí, čas utíká. 🦄');
    }
    btnIcon.textContent=running?'❚❚':'▶';btnText.textContent=running?'Pozastavit':remainingMs<=0?'Spustit znovu':remainingMs<selected*60000?'Pokračovat':'Spustit čas';
    btn.setAttribute('aria-label',btnText.textContent);btn.title=btnText.textContent;
  }
  function setTheme(next){
    theme=['rainbow',...Object.keys(sceneThemes)].includes(next)?next:'rainbow';
    Object.keys(sceneThemes).forEach(name=>document.body.classList.toggle(`is-${name}`,theme===name));
    document.body.classList.toggle('is-rainbow',theme==='rainbow');
    $('clock').toggleAttribute('hidden',theme!=='rainbow');
    Object.entries(sceneThemes).forEach(([name,scene])=>scene.svg.toggleAttribute('hidden',theme!==name));
    const chosen = allThemes.find(item=>item.id===theme) || allThemes[0];
    $('triggerEmoji').textContent=chosen.emoji;
    $('triggerLabel').textContent=`Motivy · ${chosen.label}`;
    paint();
  }
  // Během odpočtu udržuje kompatibilní telefon vzhůru. Nelze vynutit při nízké baterii nebo mimo popředí.
  let screenWakeLock=null, pendingWakeLock=null;
  async function keepScreenAwake(){
    if(!running || document.hidden || !navigator.wakeLock || screenWakeLock || pendingWakeLock)return;
    let request;
    try{
      request=navigator.wakeLock.request('screen');
      pendingWakeLock=request;
      const lock=await request;
      if(pendingWakeLock===request)pendingWakeLock=null;
      if(!running || document.hidden){await lock.release();return;}
      screenWakeLock=lock;
      lock.addEventListener('release',()=>{if(screenWakeLock===lock)screenWakeLock=null;});
    }catch(_){if(pendingWakeLock===request)pendingWakeLock=null;}
  }
  function allowScreenToSleep(){
    const lock=screenWakeLock;
    screenWakeLock=null;
    if(lock)lock.release().catch(()=>{});
  }
  function halt(){running=false;cancelAnimationFrame(frame);clearTimeout(alarmTimer);alarmTimer=0;allowScreenToSleep();}
  function hideConfetti(){clearTimeout(finishTimeout);finishedOverlay.classList.remove('show');finishedOverlay.innerHTML='';}
  function syncPresets(){document.querySelectorAll('[data-minutes]').forEach(button=>button.classList.toggle('active',Number(button.dataset.minutes)===selected));}
  function setMinutes(value){
    halt();hideConfetti();selected=Math.min(MAX_MIN,Math.max(1,Number(value)||1));remainingMs=selected*60000;lastShown=-1;
    slider.value=String(selected);selection.textContent=readableMinutes(selected);
    const preferredScale=scaleCustomized?dialMax:60;
    dialMax=Math.max(selected,preferredScale);updateScaleControls();drawScale();syncPresets();paint();
  }
  function unlockAudio(){
    if(!audioCtx){
      try{const AudioContext=window.AudioContext||window.webkitAudioContext;
        if(AudioContext)audioCtx=new AudioContext();
      }catch(e){/* Prohlížeč nepovoluje zvuk. */}
    }
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  }
  // Jemná zvonkohra: tříkrát zopakovaný motiv s delším dozníváním.
  // AudioContext vytvoříme už při kliknutí na Spustit kvůli omezením mobilních prohlížečů.
  function ringBell(preview=false){
    if(muted&&!preview)return;
    unlockAudio();if(!audioCtx)return;
    const ctx=audioCtx,start=ctx.currentTime+.035;
    const motif=[1046.5,1318.5,1568,2093,1568,1318.5];
    const motifOffsets=[0,.34,.72,1.16,1.68,2.14];
    const repeats=3;
    for(let repeat=0;repeat<repeats;repeat++){
      motif.forEach((freq,i)=>{
        const t=start+motifOffsets[i]+repeat*2.35;
        [[1,.085],[2.01,.026],[3.92,.012]].forEach(([partial,volume])=>{
          const o=ctx.createOscillator(),g=ctx.createGain();
          o.type='sine';o.frequency.setValueAtTime(freq*partial,t);
          g.gain.setValueAtTime(.00001,t);
          g.gain.exponentialRampToValueAtTime(volume*(repeat===2?1.1:1),t+.014);
          g.gain.exponentialRampToValueAtTime(.00001,t+(partial===1?2.05:.95));
          o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+2.15);
          o.onended=()=>{o.disconnect();g.disconnect();};
        });
      });
    }
  }
  function celebrate(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    hideConfetti();finishedOverlay.classList.add('show');
    const activeScene=sceneThemes[theme];
    for(let i=0;i<28;i++){
      const part=document.createElement('span');
      part.className=activeScene?activeScene.confettiClass:'unicorn-drop';
      part.style.left=(Math.random()*100)+'%';
      part.style.animationDelay=(Math.random()*1.6)+'s';
      part.style.animationDuration=(4.9+Math.random()*2.4)+'s';
      part.style.setProperty('--dx',(Math.random()*320-160)+'px');
      part.style.setProperty('--spin',`${Math.random()*180-90}deg`);
      part.innerHTML=activeScene?activeScene.confettiSvg:unicornMarkup;
      finishedOverlay.appendChild(part);
    }
    finishTimeout=setTimeout(hideConfetti,7600);
  }
  function complete(){
    halt();remainingMs=0;paint();ringBell();celebrate();
  }
  function scheduleAlarm(){
    alarmTimer=setTimeout(()=>{
      if(!running)return;
      remainingMs=Math.max(0,finishAt-performance.now());
      if(remainingMs===0)complete();else scheduleAlarm();
    },Math.max(1,remainingMs));
  }
  function tick(now){
    if(!running)return;
    remainingMs=Math.max(0,finishAt-now);
    if(remainingMs===0){complete();return;}
    paint();frame=requestAnimationFrame(tick);
  }
  function toggle(){
    if(running){halt();paint();return;}
    hideConfetti();if(remainingMs<=0)remainingMs=selected*60000;
    unlockAudio();running=true;finishAt=performance.now()+remainingMs;keepScreenAwake();scheduleAlarm();paint();frame=requestAnimationFrame(tick);
  }
  // Posuvníky mají vlastní dotykové/pointer ovládání, aby reagovaly i na telefonu.
  // Nativní input/change události zůstávají pro klávesnici a přístupnost.
  slider.addEventListener('input',()=>setMinutes(slider.value));
  slider.addEventListener('change',()=>setMinutes(slider.value));
  function setFromHorizontalPoint(clientX){
    const r=slider.getBoundingClientRect();
    if(!r.width)return;
    const x=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
    const next=Math.round(1+x*(MAX_MIN-1));
    if(next!==selected)setMinutes(next);
  }
  let horizontalDrag=false;
  slider.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;horizontalDrag=true;try{slider.setPointerCapture(e.pointerId);}catch(_){}setFromHorizontalPoint(e.clientX);});
  slider.addEventListener('pointermove',e=>{if(horizontalDrag)setFromHorizontalPoint(e.clientX);});
  const stopHorizontal=()=>{horizontalDrag=false;};
  slider.addEventListener('pointerup',stopHorizontal);
  slider.addEventListener('pointercancel',stopHorizontal);
  // iOS používá i touch události: těmito záložními handlery lze slider táhnout prstem.
  slider.addEventListener('touchmove',e=>{if(e.touches.length===1){setFromHorizontalPoint(e.touches[0].clientX);e.preventDefault();}},{passive:false});
  function setFromVerticalPoint(clientY){
    const r=scaleSlider.getBoundingClientRect();
    if(!r.height)return;
    const position=Math.max(0,Math.min(1,(clientY-r.top)/r.height));
    const value=Math.round(MAX_MIN-position*(MAX_MIN-selected));
    if(value!==dialMax)setDialScale(value);
  }
  let verticalDrag=false;
  scaleSlider.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;verticalDrag=true;try{scaleSlider.setPointerCapture(e.pointerId);}catch(_){}setFromVerticalPoint(e.clientY);e.preventDefault();});
  scaleSlider.addEventListener('pointermove',e=>{if(verticalDrag)setFromVerticalPoint(e.clientY);});
  scaleSlider.addEventListener('pointerup',()=>{verticalDrag=false;});
  scaleSlider.addEventListener('pointercancel',()=>{verticalDrag=false;});
  scaleSlider.addEventListener('touchstart',e=>{if(e.touches.length===1){setFromVerticalPoint(e.touches[0].clientY);e.preventDefault();}},{passive:false});
  scaleSlider.addEventListener('touchmove',e=>{if(e.touches.length===1){setFromVerticalPoint(e.touches[0].clientY);e.preventDefault();}},{passive:false});
  scaleSlider.addEventListener('keydown',e=>{
    const k=e.key;
    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(k))return;
    e.preventDefault();
    const delta=k==='PageUp'?10:k==='PageDown'?-10:k==='ArrowUp'||k==='ArrowRight'?1:-1;
    setDialScale(k==='Home'?selected:k==='End'?MAX_MIN:dialMax+delta);
  });

  const allThemes = [
    {id:'dino', label:'Dinosaurus', emoji:'🦕'},
    {id:'unicorn', label:'Jednorožec', emoji:'🦄'},
    {id:'rocket', label:'Raketa', emoji:'🚀'},
    {id:'digger', label:'Bagr', emoji:'🚜'},
    {id:'giraffe', label:'Žirafa', emoji:'🦒'},
    {id:'car', label:'Autíčko', emoji:'🚗'},
    {id:'tractor', label:'Traktor', emoji:'🚜'},
    {id:'firetruck', label:'Hasiči', emoji:'🚒'},
    {id:'ocean', label:'Mořský svět', emoji:'🐳'},
    {id:'princess', label:'Princezna', emoji:'👸'},
    {id:'knight', label:'Rytíř', emoji:'🛡️'},
    {id:'rainbow', label:'Duha · ciferník', emoji:'🌈'}
  ];
  const menuTrigger = $('menuTrigger');
  const mainMenu = $('mainMenu');
  function closeMenu(restoreFocus=false){
    if(mainMenu.hidden)return;
    mainMenu.hidden=true;
    menuTrigger.setAttribute('aria-expanded','false');
    if(restoreFocus)menuTrigger.focus();
  }
  menuTrigger.addEventListener('click',()=>{
    mainMenu.hidden=!mainMenu.hidden;
    menuTrigger.setAttribute('aria-expanded',String(!mainMenu.hidden));
  });
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu-wrap'))closeMenu();});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!mainMenu.hidden){e.preventDefault();closeMenu(true);}
  });
  const themeTrigger = $('themeTrigger');
  const themeModal = $('themeModal');
  const presetModal = $('presetModal');
  const presetTrigger = $('presetTrigger');
  const themeGrid = $('themeGrid');
  let favoritesOnly = false;
  let favorites = new Set();
  try {
    const stored = JSON.parse(localStorage.getItem('duhove-favorites-v1') || '[]');
    if (Array.isArray(stored)) favorites = new Set(stored.filter(value => allThemes.some(item => item.id === value)));
  } catch (_) { /* private browsing may disable storage */ }
  function persistFavorites(){ try { localStorage.setItem('duhove-favorites-v1',JSON.stringify([...favorites])); } catch(_) {} }
  function renderThemeOptions(){
    $('showAllThemes').classList.toggle('active', !favoritesOnly);
    $('showFavoriteThemes').classList.toggle('active', favoritesOnly);
    $('showAllThemes').setAttribute('aria-pressed',String(!favoritesOnly));
    $('showFavoriteThemes').setAttribute('aria-pressed',String(favoritesOnly));
    themeGrid.replaceChildren();
    const shown = allThemes.filter(item => !favoritesOnly || favorites.has(item.id));
    if(!shown.length){
      const empty=document.createElement('p');empty.className='theme-empty';empty.textContent='Ještě tu nemáš žádný oblíbený motiv. Přepni na Všechny motivy a označ srdíčko. ♡';
      themeGrid.appendChild(empty);return;
    }
    for(const item of shown){
      const tile=document.createElement('button');
      tile.type='button';tile.className='theme-tile';tile.setAttribute('aria-label',`Vybrat: ${item.label}`);
      tile.classList.toggle('active',theme===item.id);
      tile.innerHTML=`<span class="theme-tile-emoji" aria-hidden="true">${item.emoji}</span><span class="theme-tile-name">${item.label}</span>`;
      tile.addEventListener('click',()=>{setTheme(item.id);closeThemeDialog();});
      const heart=document.createElement('button');
      heart.type='button';heart.className='tile-heart';heart.classList.toggle('favorite',favorites.has(item.id));
      heart.textContent=favorites.has(item.id)?'♥':'♡';heart.setAttribute('aria-label',favorites.has(item.id)?`Odebrat z oblíbených: ${item.label}`:`Přidat do oblíbených: ${item.label}`);
      heart.setAttribute('aria-pressed',String(favorites.has(item.id)));
      heart.addEventListener('click',event=>{event.stopPropagation();if(favorites.has(item.id))favorites.delete(item.id);else favorites.add(item.id);persistFavorites();renderThemeOptions();});
      // The heart is visually attached to the tile but not nested inside its button.
      const wrapper=document.createElement('div');wrapper.style.position='relative';wrapper.append(tile,heart);
      themeGrid.appendChild(wrapper);
    }
  }
  function openThemeDialog(){
    closeMenu();
    if(!presetModal.hidden)closePresetDialog();
    favoritesOnly=false;renderThemeOptions();themeModal.hidden=false;document.body.classList.add('theme-modal-open');
    themeTrigger.setAttribute('aria-expanded','true');$('closeThemes').focus();
  }
  function closeThemeDialog(){
    if(themeModal.hidden)return;
    themeModal.hidden=true;document.body.classList.remove('theme-modal-open');
    themeTrigger.setAttribute('aria-expanded','false');menuTrigger.focus();
  }
  function openPresetDialog(){
    closeMenu();
    if(!themeModal.hidden)closeThemeDialog();
    presetModal.hidden=false;
    document.body.classList.add('theme-modal-open');
    presetTrigger.setAttribute('aria-expanded','true');
    $('closePresets').focus();
  }
  function closePresetDialog(){
    if(presetModal.hidden)return;
    presetModal.hidden=true;
    document.body.classList.remove('theme-modal-open');
    presetTrigger.setAttribute('aria-expanded','false');
    menuTrigger.focus();
  }
  presetTrigger.addEventListener('click',openPresetDialog);
  $('closePresets').addEventListener('click',closePresetDialog);
  presetModal.addEventListener('click',e=>{if(e.target===presetModal)closePresetDialog();});
  themeTrigger.addEventListener('click',openThemeDialog);
  $('closeThemes').addEventListener('click',closeThemeDialog);
  themeModal.addEventListener('click',e=>{if(e.target===themeModal)closeThemeDialog();});
  $('showAllThemes').addEventListener('click',()=>{favoritesOnly=false;renderThemeOptions();});
  $('showFavoriteThemes').addEventListener('click',()=>{favoritesOnly=true;renderThemeOptions();});
  document.addEventListener('keydown',e=>{
    const openModal=!themeModal.hidden?themeModal:(!presetModal.hidden?presetModal:null);
    if(!openModal)return;
    if(e.key==='Escape'){e.preventDefault();if(openModal===themeModal)closeThemeDialog();else closePresetDialog();}
    if(e.key==='Tab'){
      const els=[...openModal.querySelectorAll('button:not(:disabled)')].filter(el=>el.offsetWidth||el.offsetHeight||el.getClientRects().length);
      if(!els.length)return;
      if(e.shiftKey && document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}
      else if(!e.shiftKey && document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}
    }
  });

  // Mezerník ovládá časovač i po kliknutí na ostatní ovládací tlačítka.
  document.addEventListener('keydown',e=>{
    if(e.code!=='Space'&&e.key!==' ')return;
    if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey || !themeModal.hidden || !presetModal.hidden)return;
    const active=document.activeElement;
    if(active&&(active.isContentEditable||active.matches('textarea, select, button, a, input:not([type="range"])')))return;
    e.preventDefault();
    if(!e.repeat)toggle();
  },true);
  $('previewSound').addEventListener('click',()=>ringBell(true));
  document.querySelectorAll('[data-minutes]').forEach(button=>button.addEventListener('click',()=>{setMinutes(button.dataset.minutes);closePresetDialog();}));
  btn.addEventListener('click',toggle);
  $('reset').addEventListener('click',()=>setMinutes(selected));
  $('soundBtn').addEventListener('click',()=>{muted=!muted;if(!muted)unlockAudio();$('soundIcon').textContent=muted?'🔇':'🔊';$('soundText').textContent=muted?'Zvuk vypnutý':'Zvuk zapnutý';$('soundBtn').setAttribute('aria-label',muted?'Zapnout zvuk':'Vypnout zvuk');});
  $('fullBtn').addEventListener('click',async()=>{
    try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(e){}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden){allowScreenToSleep();return;}if(running){remainingMs=Math.max(0,finishAt-performance.now());if(!remainingMs)complete();else{paint();keepScreenAwake();}}});
  window.addEventListener('pagehide',allowScreenToSleep);
  window.addEventListener('pageshow',()=>{if(running&&!document.hidden)keepScreenAwake();});
  calibrateSceneBounds();
  setMinutes(20);
  setTheme('dino');
})();
</script>
</body>
